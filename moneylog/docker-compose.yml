version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: moneylog
      POSTGRES_USER: moneylog
      POSTGRES_PASSWORD: moneylog
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: python3 manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DB_HOST: db

volumes:
  postgres_data:
