{% extends "finance/base.html" %}

{% block content %}

<h1>Add Transaction</h1>

{% if form.errors %}

        <p>Please fix the errors below:</p>
    </div>
{% endif %}

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

</form>

<a href="/">Back to Dashboard</a>

{% endblock %}
